[package]
name = "hostreach"
version = "0.1.0"
edition = "2021"
description = "Fast, reliable CLI tool to check reachable hosts from a URL list. No TLS verification, async, configurable concurrency."
license = "MIT"
repository = "https://github.com/mnk-works/hostreach"
readme = "README.md"
keywords = ["network", "reachability", "http", "tcp", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rlimit = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "sync", "signal"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true